[package]
name = "s-curve"
version = "0.1.0"
edition = "2021"
authors = ["s-curve team"]
default-run = "s-curve"
publish = false

[dependencies]
axum = { version = "0.7", features = ["macros", "ws"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "macros", "uuid", "chrono", "migrate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
tower-http = { version = "0.5", features = ["cors", "trace"] }
utoipa = { version = "4", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "7", features = ["axum", "reqwest"] }
serde_path_to_error = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive"] }
async-trait = "0.1"
axum-server = { version = "0.7", features = ["tls-rustls"] }
sha2 = "0.10"
hex = "0.4"
rustls = { version = "0.23", features = ["ring"] }
tower_governor = "0.4.2"
regex = "1.12.2"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
tower = "0.5"
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 2        # Lower than 3 -> much faster to build, still optimized
lto = "thin"         # "fat" or true is slower to build; "thin" is faster but still optimizes cross-crate
codegen-units = 8    # Parallelize code generation across threads (faster build, a bit larger binary)
incremental = true   # Reuse previous compilation results
strip = "symbols"    # Reduces binary size, faster linking on some systems
panic = "abort"      # Removes unwinding code, faster compile + smaller binary

[profile.local-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
strip = "none"
debug = 0
incremental = true

[profile.staging]
inherits = "release"
lto = false          # skip link-time optimisation — saves 30-60s on the link step
codegen-units = 16   # more parallelism than release (8), less than local-release (256)

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
